name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Fast, blocking gate: typecheck, lint, unit tests. Every dev-tested and
  # E2E-tested workflow in this project has so far only run on Windows (see
  # the win32-specific process-counting code in tests/performance/ and
  # tests/e2e/loadTest*.spec.ts, which degrade gracefully — returning -1 —
  # on other platforms but were never exercised there), so this stays on
  # windows-latest rather than assuming untested cross-platform CI behavior.
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Rebuild native modules for Node ABI
        run: npm run rebuild:node
      - run: npm test

  # Real Electron/Chromium E2E suite — blocking, since this is the only
  # thing that actually exercises the packaged app's behavior end to end.
  e2e:
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Rebuild native modules for Electron ABI
        run: npm run rebuild:electron
      - run: npm run build
      - name: E2E suite (excludes loadTest*.spec.ts — those need a DB seeded
          by the separate, non-blocking `performance` job; see playwright.config.ts)
        run: npm run test:e2e
        env:
          PF_E2E_BLOCKING_GATE: '1'
      # GitHub's job-log download endpoint needs admin rights on the repo,
      # even for a public one — confirmed directly (403 "Must have admin
      # rights to Repository") while investigating this job's first-ever
      # live failure. The Checks API's annotations are reachable without
      # that, but only ever carry a generic "Process completed with exit
      # code 1", not which test failed or why. Playwright already writes a
      # per-failure error-context.md (and any trace/screenshot files) into
      # test-results/ regardless of reporter verbosity — that's the actual
      # gap: nothing preserved it past the job's own lifetime. Uploading it
      # as an artifact makes a future failure inspectable (via the Actions
      # UI or the artifacts API) without needing a token at all.
      - name: Upload E2E failure diagnostics (error-context.md, traces, screenshots)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-diagnostics
          path: test-results/
          retention-days: 7

  # Load/performance suite — deliberately NOT in the `needs:` chain of
  # anything, and not required for the workflow to pass (continue-on-error).
  # These tests spawn real, simultaneous Electron/Chromium processes and
  # measure real wall-clock time/RAM (see tests/performance/*_RAW.md) —
  # absolute numbers are inherently sensitive to whatever CI runner
  # happens to be free that day, so this job exists to catch REGRESSIONS
  # and keep the *_RAW.md reports current, not to gate merges on a runner's
  # instantaneous hardware. Low priority, but visible: failures show up as
  # a red job in the checks list, not silently, even though they don't
  # block anything.
  performance:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      # better-sqlite3 is ABI-locked to whichever runtime last rebuilt it
      # (plain Node vs. Electron's own Node build have different
      # NODE_MODULE_VERSIONs) — test:perf runs under plain Node (vitest), so
      # it must run BEFORE the Electron rebuild below, not after. Running
      # this job on a real GitHub Actions runner for the first time (see the
      # test PR that verified this workflow) caught this ordering bug live:
      # test:perf failed with a NODE_MODULE_VERSION mismatch because the
      # first version of this job rebuilt for Electron before running it.
      - name: Rebuild native modules for Node ABI
        run: npm run rebuild:node
      - name: Vitest-based performance tests (tests/performance/*.test.ts)
        run: npm run test:perf
      - run: npx playwright install --with-deps chromium
      - name: Rebuild native modules for Electron ABI
        if: always()
        run: npm run rebuild:electron
      - run: npm run build
        if: always()
      - name: E2E load-test suite (tests/e2e/loadTest*.spec.ts)
        if: always()
        run: npx playwright test tests/e2e/loadTestBulkStartStop.spec.ts tests/e2e/loadTestClone.spec.ts tests/e2e/loadTestIsolation.spec.ts tests/e2e/loadTestStability.spec.ts tests/e2e/loadTestUIResponsiveness.spec.ts
      - name: Upload regenerated performance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-reports
          path: tests/performance/*_RAW.md
