name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Fast, blocking gate: typecheck, lint, unit tests. Every dev-tested and
  # E2E-tested workflow in this project has so far only run on Windows (see
  # the win32-specific process-counting code in tests/performance/ and
  # tests/e2e/loadTest*.spec.ts, which degrade gracefully — returning -1 —
  # on other platforms but were never exercised there), so this stays on
  # windows-latest rather than assuming untested cross-platform CI behavior.
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Fails the build if platformProfiles.ts's hardcoded browserVersion
      # (baked into every generated profile's spoofed User-Agent) no longer
      # matches the real installed Electron's actual Chromium version — see
      # scripts/checkBrowserVersionSync.js's own doc comment and
      # docs/FINGERPRINT_AUDIT.md's "Ninth investigation" for why a silent
      # drift here is a real, detectable UA-vs-TLS-handshake mismatch, not
      # just a cosmetic inconsistency. Needs no native-module rebuild first
      # — it only launches the electron binary itself, never touches
      # better-sqlite3.
      - run: npm run check:browser-version
      # Same principle, generalized to every production dependency: fails
      # the build if any of them declares an engines.node range the real
      # Electron-bundled Node doesn't satisfy — the exact class of bug that
      # shipped once already (undici@8 requiring Node >=22.19 while
      # Electron 32.3.3 bundles Node 20.18.1, crashing every profile start
      # at module-load time) and was only caught by a real E2E run, not by
      # typecheck/lint/unit tests. See
      # scripts/checkDependencyEnginesSync.js's own doc comment.
      - run: npm run check:dependency-engines
      - name: Rebuild native modules for Node ABI
        run: npm run rebuild:node
      # Runs the exact same unit/integration suite as `npm test` plus a
      # coverage-threshold gate (see vitest.config.ts's `coverage.thresholds`
      # — 70% statements). Was a deliberately-red gate against a measured
      # 54.45%, then 63.5%, then 67.83% baseline across several stages —
      # crossed for the first time at 70.64% once ProfilesToolbar.tsx,
      # BulkToolbar.tsx, LogsPage.tsx, DownloadsPage.tsx,
      # ProfileContextMenu.tsx, profileWindowArgs.ts, and three renderer
      # hooks got real unit tests. Replaces the plain `npm test` step rather
      # than running both, since that would just execute the same tests
      # twice.
      - run: npm run test:coverage

  # Real Electron/Chromium E2E suite — blocking, since this is the only
  # thing that actually exercises the packaged app's behavior end to end.
  e2e:
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Rebuild native modules for Electron ABI
        run: npm run rebuild:electron
      - run: npm run build
      - name: E2E suite (excludes loadTest*.spec.ts — those need a DB seeded
          by the separate, non-blocking `performance` job; see playwright.config.ts)
        run: npm run test:e2e
        env:
          PF_E2E_BLOCKING_GATE: '1'
      # GitHub's job-log download endpoint needs admin rights on the repo,
      # even for a public one — confirmed directly (403 "Must have admin
      # rights to Repository") while investigating this job's first-ever
      # live failure. The Checks API's annotations are reachable without
      # that, but only ever carry a generic "Process completed with exit
      # code 1", not which test failed or why. Playwright already writes a
      # per-failure error-context.md (and any trace/screenshot files) into
      # test-results/ regardless of reporter verbosity — that's the actual
      # gap: nothing preserved it past the job's own lifetime. Uploading it
      # as an artifact makes a future failure inspectable (via the Actions
      # UI or the artifacts API) without needing a token at all.
      - name: Upload E2E failure diagnostics (error-context.md, traces, screenshots)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-diagnostics
          path: test-results/
          retention-days: 7

  # Load/performance suite — deliberately NOT in the `needs:` chain of
  # anything, and not required for the workflow to pass (continue-on-error).
  # These tests spawn real, simultaneous Electron/Chromium processes and
  # measure real wall-clock time/RAM (see tests/performance/*_RAW.md) —
  # absolute numbers are inherently sensitive to whatever CI runner
  # happens to be free that day, so this job exists to catch REGRESSIONS
  # and keep the *_RAW.md reports current, not to gate merges on a runner's
  # instantaneous hardware. Low priority, but visible: failures show up as
  # a red job in the checks list, not silently, even though they don't
  # block anything.
  performance:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      # better-sqlite3 is ABI-locked to whichever runtime last rebuilt it
      # (plain Node vs. Electron's own Node build have different
      # NODE_MODULE_VERSIONs) — test:perf runs under plain Node (vitest), so
      # it must run BEFORE the Electron rebuild below, not after. Running
      # this job on a real GitHub Actions runner for the first time (see the
      # test PR that verified this workflow) caught this ordering bug live:
      # test:perf failed with a NODE_MODULE_VERSION mismatch because the
      # first version of this job rebuilt for Electron before running it.
      - name: Rebuild native modules for Node ABI
        run: npm run rebuild:node
      - name: Vitest-based performance tests (tests/performance/*.test.ts)
        run: npm run test:perf
      - run: npx playwright install --with-deps chromium
      - name: Rebuild native modules for Electron ABI
        if: always()
        run: npm run rebuild:electron
      - run: npm run build
        if: always()
      - name: E2E load-test suite (tests/e2e/loadTest*.spec.ts)
        if: always()
        run: npx playwright test tests/e2e/loadTestBulkStartStop.spec.ts tests/e2e/loadTestClone.spec.ts tests/e2e/loadTestIsolation.spec.ts tests/e2e/loadTestStability.spec.ts tests/e2e/loadTestUIResponsiveness.spec.ts
      - name: Upload regenerated performance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-reports
          path: tests/performance/*_RAW.md

  # Real macOS packaging + smoke test — best-effort, not required (continue-
  # on-error), same non-blocking pattern as `performance` above. This repo's
  # build.mac config (package.json) has existed since the "GoblinAnty
  # rebrand" stage but was, until this job, NEVER actually run on a real
  # macOS host: electron-builder refuses macOS packaging from any
  # non-macOS host categorically (confirmed directly, documented in
  # CHANGELOG.md), so a Windows dev machine — the only environment this
  # project has otherwise ever built/tested on — cannot verify it at all.
  # `macos-latest` is a genuine macOS host, and Actions minutes on it are
  # free and unlimited for this public repository, so this is the first
  # real opportunity to find out whether `npm run package:mac` (unsigned,
  # per package.json's `identity: null`) actually produces a launchable
  # .app — not assumed, whatever this job's first real run reports is the
  # first honest data point on that question.
  package-macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Rebuild native modules for Electron ABI
        run: npm run rebuild:electron
      # `npm run package:mac` alone actually SUCCEEDED the first time this
      # job ever ran on a real macOS host (release/GoblinAnty-0.3.0-arm64-
      # mac.zip was genuinely built) — the job still failed because
      # electron-builder auto-detects package.json's `build.publish`
      # (github provider, for the existing Windows release flow) and tries
      # to publish a GitHub release unless told not to, which needs a
      # GH_TOKEN this job intentionally doesn't have (this job verifies a
      # build, it doesn't cut a release). `--publish never` disables that
      # auto-publish attempt. Also: output goes to `release/`, not `dist/`
      # — package.json's `build.directories.output` — a mistake in this
      # job's first version that the artifact-upload/smoke-test paths
      # below now match.
      - name: Build unsigned macOS package (no auto-publish)
        run: |
          npm run build
          npx electron-builder --mac --publish never
      # Minimal smoke test: launches the actual packaged .app (not the
      # source tree, unlike the `e2e` job above — this is specifically
      # checking that what electron-builder produced is a launchable
      # binary) and confirms the process is still alive a few seconds
      # later, i.e. it didn't crash on startup. Not a full E2E pass —
      # just answers "does the packaged artifact even start" for the
      # first time.
      - name: Smoke test — launch the packaged .app and confirm it stays up
        shell: bash
        run: |
          APP_PATH=$(find release -name "*.app" | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found under release/ — package:mac did not produce one"
            exit 1
          fi
          echo "Found: $APP_PATH"
          open -n "$APP_PATH"
          sleep 8
          if ! pgrep -f "$(basename "$APP_PATH" .app)" > /dev/null; then
            echo "Packaged app is not running after launch — it likely crashed on startup"
            exit 1
          fi
          echo "Packaged app is running."
          pkill -f "$(basename "$APP_PATH" .app)" || true
      - name: Upload the unsigned macOS package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-package-unsigned
          path: |
            release/*.zip
            release/**/*.app
          retention-days: 7
