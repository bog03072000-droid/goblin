<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com" />
<title>Goblin Browser</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --ink: #121412;
    --char: #1c1f1c;
    --char-raised: #23271f;
    --char-hi: #2b3126;
    --stroke: #343b30;
    --lime: #7cb342;
    --lime-deep: #4c7a1f;
    --lime-glow: rgba(124, 179, 66, 0.45);
    --paper: #f2f5ee;
    --ash: #aab3a2;
    --ash-dim: #7c8577;
    --radius-input: 12px;
    --ease: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Inter', system-ui, sans-serif;
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; }

  #tabbar {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    padding: 8px 10px 0;
    background: var(--char);
    -webkit-app-region: drag;
    flex: 0 0 auto;
  }
  .tab {
    display: flex; align-items: center; gap: 8px; max-width: 200px; min-width: 110px;
    background: var(--char-raised); color: var(--ash); border: 1px solid var(--stroke); border-bottom: none;
    border-radius: 10px 10px 0 0; padding: 7px 10px;
    cursor: pointer; font-size: 12px; font-weight: 500; -webkit-app-region: no-drag; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
    transition: background var(--ease), color var(--ease), box-shadow var(--ease);
  }
  .tab:hover { background: var(--char-hi); color: var(--paper); }
  .tab.active {
    background: var(--char-hi); color: var(--lime);
    box-shadow: inset 0 2px 0 var(--lime), 0 0 12px -4px var(--lime-glow);
    text-shadow: 0 0 8px var(--lime-glow);
  }
  .tab .tab-title { overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .tab .tab-close {
    color: var(--ash-dim); padding: 0 4px; border-radius: 4px; line-height: 1.4;
    transition: background var(--ease), color var(--ease);
  }
  .tab .tab-close:hover { background: var(--stroke); color: var(--paper); }
  #new-tab {
    -webkit-app-region: no-drag; color: var(--ash-dim); padding: 6px 12px; cursor: pointer;
    font-size: 15px; border-radius: 8px 8px 0 0; transition: color var(--ease), background var(--ease);
  }
  #new-tab:hover { color: var(--lime); background: var(--char-raised); }

  #toolbar {
    display: flex; align-items: center; gap: 6px; padding: 8px 10px;
    background: var(--char-raised); border-bottom: 1px solid var(--stroke);
    -webkit-app-region: drag; flex: 0 0 auto;
  }
  #toolbar button, #toolbar input { -webkit-app-region: no-drag; font-family: inherit; }

  .icon-btn {
    display: flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; background: transparent; color: var(--ash);
    border: none; border-radius: 8px; cursor: pointer; font-size: 15px; flex: 0 0 auto;
    transition: background var(--ease), color var(--ease);
  }
  .icon-btn:hover { background: var(--char-hi); color: var(--lime); }

  .btn {
    border: 1px solid var(--stroke); border-radius: 10px; padding: 6px 14px;
    cursor: pointer; font-size: 13px; font-weight: 600; font-family: inherit;
    background: var(--char-hi); color: var(--paper);
    transition: background var(--ease), color var(--ease), border-color var(--ease), box-shadow var(--ease), transform var(--ease);
    flex: 0 0 auto; white-space: nowrap;
  }
  .btn:hover { background: var(--stroke); border-color: var(--lime-deep); color: var(--lime); }
  .btn:active { transform: translateY(1px); }
  .btn-primary {
    background: linear-gradient(180deg, var(--lime) 0%, var(--lime-deep) 100%);
    border-color: transparent; color: var(--ink);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), inset 0 -2px 4px rgba(0, 0, 0, 0.25);
  }
  .btn-primary:hover { color: var(--ink); filter: brightness(1.08); }

  #address {
    flex: 1; border-radius: var(--radius-input); border: 1px solid var(--stroke);
    background: var(--char); color: var(--paper); padding: 7px 12px; font-size: 13px;
    outline: none; transition: border-color var(--ease), box-shadow var(--ease);
  }
  #address:focus { border-color: var(--lime); box-shadow: 0 0 0 3px var(--lime-glow); }

  #label { color: var(--ash-dim); font-size: 11px; align-self: center; padding-left: 8px; white-space: nowrap; }

  .downloads-wrap { position: relative; flex: 0 0 auto; }
  .downloads-badge {
    position: absolute; top: 1px; right: 1px; background: var(--lime); color: var(--ink);
    font-size: 9px; font-weight: 700; border-radius: 999px; min-width: 14px; height: 14px;
    line-height: 14px; text-align: center; padding: 0 2px;
  }
  .downloads-panel {
    position: absolute; top: 36px; right: 0; width: 320px; max-height: 380px; overflow: auto;
    background: var(--char-raised); border: 1px solid var(--stroke); border-radius: 12px;
    box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.6); z-index: 50; padding: 8px;
  }
  .download-item { padding: 8px; border-radius: 8px; margin-bottom: 6px; background: var(--char); }
  .download-item:last-child { margin-bottom: 0; }
  .download-name {
    font-size: 12px; color: var(--paper); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; margin-bottom: 4px;
  }
  .download-progress { height: 4px; border-radius: 999px; background: var(--stroke); overflow: hidden; margin-bottom: 6px; }
  .download-progress-fill { height: 100%; background: var(--lime); transition: width var(--ease); }
  .download-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .download-status { font-size: 10px; color: var(--ash-dim); text-transform: uppercase; letter-spacing: 0.04em; }
  .download-actions { display: flex; gap: 6px; }
  .downloads-empty { font-size: 12px; color: var(--ash-dim); padding: 12px; text-align: center; }

  #webviews { position: relative; flex: 1 1 auto; min-height: 0; }
  /* Every tab's <webview> stays laid out at full size at all times — only
     z-index/visibility switch between tabs. Toggling display:none/block
     instead (the previous approach) is a known Electron <webview> trap: the
     guest process can fail to pick up its real size the moment it goes from
     hidden back to visible, leaving a small stale render surface with dead
     space around it regardless of how correct the CSS box itself is. */
  #webviews webview { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
</style>
</head>
<body>
  <div id="tabbar">
    <span id="new-tab" title="New Tab">+</span>
  </div>
  <div id="toolbar">
    <button id="back" class="icon-btn" title="Back">&#8592;</button>
    <button id="fwd" class="icon-btn" title="Forward">&#8594;</button>
    <button id="reload" class="icon-btn" title="Reload">&#8635;</button>
    <button id="home" class="icon-btn" title="Home">&#8962;</button>
    <input id="address" type="text" value="about:blank" />
    <button id="go" class="btn btn-primary">Go</button>
    <button id="duplicate" class="btn">Duplicate Tab</button>
    <button id="devtools" class="btn">DevTools</button>
    <button id="diagnostics" class="btn">Diagnostics</button>
    <div class="downloads-wrap">
      <button id="downloads-toggle" class="icon-btn" title="Downloads">&#8681;<span id="downloads-badge" class="downloads-badge" hidden>0</span></button>
      <div id="downloads-panel" class="downloads-panel" hidden></div>
    </div>
    <span id="label"></span>
  </div>
  <div id="webviews"></div>
  <script src="browser-shell.js"></script>
</body>
</html>
